# OmniBCI Plugin Manifest — schema version 2

manifest_version = 2

[package]
id = "neuroscan_curry8_reader"
version = "0.1.0"
api_version = "2"
publisher = "OmniBCI"

[[contributions]]
id = "default"
kind = "acquisition"
plugin_type = "neuroscan_curry8_reader"
entrypoint = "curry8:Curry8DataReader"
display_name = "Neuroscan CURRY 8"
description = "Neuroscan CURRY 8 NetStreaming EEG acquisition driver."

[contributions.configuration]
schema = "default.schema.json"
schema_version = 1

[[contributions]]
id = "trigger"
kind = "trigger"
plugin_type = "neuroscan_curry8_trigger"
entrypoint = "trigger:Curry8Trigger"
display_name = "Neuroscan CURRY 8 Parallel Trigger"
description = "Parallel-port TTL event output for CURRY 8. Requires Windows and compatible Neuroscan trigger hardware."
platforms = ["win32"]

[contributions.configuration]
schema = "trigger.schema.json"
schema_version = 1
