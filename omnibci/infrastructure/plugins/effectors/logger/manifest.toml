# OmniBCI Plugin Manifest — schema version 1

manifest_version = 1

[package]
domain = "actuation"
id = "logger"
version = "0.1.0"
api_version = "1"
publisher = "omnibci"

[[contributions]]
id = "default"
kind = "effector"
entrypoint = "effector:LogEffector"
display_name = "Log Effector"
description = "Hardware-free effector that logs each actuation command — end-to-end smoke testing without a device."

[contributions.configuration]
schema = "default.schema.json"
schema_version = 1

[contributions.payload_schemas]
command = "command.schema.json"
