# OmniBCI Plugin Manifest — schema version 2
# ─────────────────────────────────────────────────────────────────────────────
# This file is the single source of truth for plugin identity and metadata.
# It is read at discovery time (no code execution, no OpenGL import).

manifest_version = 2

[package]
id = "classic40SSVEP"
version = "0.1.0"
api_version = "1"
publisher = "OmniBCI"

[[contributions]]
id = "default"
kind = "paradigm"
plugin_type = "STIMULATION_THUBCI_SSVEP_classic40"
entrypoint = "ssvep:Classic40SSVEP_2"
display_name = "Classic 40-target SSVEP"
description = "40-class steady-state visual evoked potential paradigm (THUBCI)."

[contributions.params]
targets = 40
layout = "5 × 8"
resolution = "1920 × 1080"
refresh_rate_hz = 60
stim_time_s = 4
frequency_hz = "8.0 – 15.8"
frequency_step_hz = 0.2
phase_step = "0.5 π"

[contributions.controls.n_trials]
label = "Trial count"
type = "int"
default = 1
min = 1
field = "n_trials"

[contributions.controls.target_cue]
label = "Target cue"
type = "int"
default = 1
min = 0
max = 40
field = "trial_params"
