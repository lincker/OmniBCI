# OmniBCI Plugin Manifest — schema version 1
# ─────────────────────────────────────────────────────────────────────────────
# This file is the single source of truth for plugin identity and metadata.
# It is read at discovery time (no code execution, no OpenGL import).

manifest_version = 1

[package]
domain = "stimulation"
id = "classic40SSVEP"
version = "0.1.0"
api_version = "1"
publisher = "OmniBCI"

[[contributions]]
id = "default"
kind = "paradigm"
entrypoint = "ssvep:Classic40SSVEP_2"
display_name = "Classic 40-target SSVEP"
description = "40-class steady-state visual evoked potential paradigm (THUBCI)."

[contributions.controls.n_trials]
label = "Trial count"
type = "int"
default = 1
min = 1
field = "n_trials"

[contributions.controls.target_cue]
label = "Target cue"
type = "int"
default = 1
default_sequence = "1-40"
min = 0
max = 40
field = "trial_params"
payload_key = "event_id"

[contributions.configuration]
schema = "default.schema.json"
schema_version = 1

[contributions.payload_schemas]
trial = "trial.schema.json"
result = "result.schema.json"
