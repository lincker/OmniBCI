# OmniBCI Plugin Manifest — schema version 1
manifest_version = 1

[package]
domain = "stimulation"
id = "command10SSVEP"
version = "0.1.0"
api_version = "1"
publisher = "OmniBCI"

[[contributions]]
id = "default"
kind = "paradigm"
entrypoint = "paradigm:Command10SSVEP"
display_name = "10-command SSVEP"
description = "Four direction targets with A/B/C and X/Y/Z command targets at fixed 60 Hz."

[contributions.controls.n_trials]
label = "Trial count"
type = "int"
default = 1
min = 1
field = "n_trials"

[contributions.controls.target_cue]
label = "Target cue (0 = free choice)"
type = "int"
default = 1
default_sequence = "1-10"
min = 0
max = 10
field = "trial_params"
payload_key = "cue_target_id"

[contributions.configuration]
schema = "default.schema.json"
schema_version = 1

[contributions.payload_schemas]
trial = "trial.schema.json"
result = "result.schema.json"
