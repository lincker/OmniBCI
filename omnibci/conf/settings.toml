project_name = "OmniBCI"
version = "0.1.0"
debug = false

[LOGGING]
level = "INFO"
file_path = "logs/omnibci.log"

[CONSTANT]
ASYNC_SLEEP_TIME=0.01

[ACQUISITION]
signal_source = "file_reader"
trigger = 'neuroscan_scan45_trigger'
channel_number = 10
sample_rate = 1000

file_reader_chunk_size = 100
file_reader_play_speed = 1.0
data_file_path = "/Users/lincker/workspace/OmniBCI/tests/acquisition/../fixture/train.cnt"

DATA_PROVIDER_IP = '192.168.0.3'
DATA_PROVIDER_PORT = 4000

[ALGORITHM]
#decoder = 'THUBCI_SSVEP_classic40CCA'
decoder = "THUBCI_SSVEP_classic40CCA"
epoch_detector = 'DEFAULT_EPOCH_DETECTOR'
window_duration = 3
offset_time = 0.14
# Seconds of pre-trigger baseline captured per epoch (0 = none). Per-paradigm.
baseline_duration = 0.0
# Ordered preprocessing filters applied to the window before decoding.
# Plugin_type ids, applied in order. Empty = none.
# e.g. filters = ['BASELINE_CORRECTION']
filters = []

[NEUROENGINE]
# Max items in each mp.Queue between engine and workers.
queue_size = 100
message_server_ip = '127.0.0.1'
message_server_port = 8765   # must differ from uvicorn HTTP port (8000)

COMMAND_SERVER_IP = '127.0.0.1'
COMMAND_SERVER_PORT = 8080

[ACTUATION]
# Actuation (external-device control) subsystem. The engine listens on
# server_ip:server_port; the actuation controller dials in (same topology as
# stimulation) and loads the Effector plugin named below to carry out commands.
enabled = false
server_ip = '127.0.0.1'
server_port = 8001
watchdog_timeout_s = 1.0
# Drop commands older than this on the actuation side (seconds). 0 = disabled
# (default). Requires engine/device clocks roughly in sync (LAN + NTP is
# plenty); leave 0 if clocks are not trustworthy.
max_command_age_s = 0.0
# Spawn the actuation subprocess automatically when the engine starts
# (single-machine). false = start it manually: python scripts/run_actuation.py
auto_spawn = true
# plugin_type of the Effector plugin the actuation subsystem loads (read by the
# actuation-subsystem loader; empty = none). Parallel to STIMULATION.paradigm.
effector = ''

[PERSISTENCE]
# Session repository implementation (composition-root switch).
# "in_memory" (default; lost on restart) — SQLite adapter planned for stage 3.
session_repository = "in_memory"

[STIMULATION]
paradigm    = 'STIMULATION_THUBCI_SSVEP_classic40'
renderer    = "moderngl"
auto_spawn  = true   # false → multi-machine: start run_stimulation.py manually

[ssvep]
sample_rate = 1000
duration = 3
offset_time = 0.14
[PLUGINS]
# User plugin directory. Leave empty to use the platform default:
#   macOS   : ~/Library/Application Support/OmniBCI/plugins
#   Linux   : ~/.local/share/OmniBCI/plugins
#   Windows : %APPDATA%\OmniBCI\OmniBCI\plugins
# Override with the OMNIBCI_PLUGIN_DIR env var or set an absolute path here.
user_dir = ""

[PROFILES]
active = "1"
