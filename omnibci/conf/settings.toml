project_name = "OmniBCI"
version = "0.1.0"
debug = false

[LOGGING]
level = "INFO"
file_path = "logs/omnibci.log"

[CONSTANT]
ASYNC_SLEEP_TIME=0.01

[ACQUISITION]
data_source = "file_reader"
trigger = 'neuroscan_scan45_trigger'
data_channel_number = 9

file_reader_chunk_size = 100
file_reader_play_speed = 1.0
data_file_path = "/Users/lincker/workspace/OmniBCI/tests/acquisition/../fixture/train.cnt"

DATA_PROVIDER_IP = '192.168.0.3'
DATA_PROVIDER_PORT = 4000

[ALGORITHM]
decoder = 'THUBCI_SSVEP_classic40CCA'
segmenter = 'EPOCH_SEGMENTER'

[NEUROENGINE]
MESSAGE_SERVER_IP = 'localhost'
MESSAGE_SERVER_PORT = 8000

COMMAND_SERVER_IP = 'localhost'
COMMAND_SERVER_PORT = 8080

[STIMULATION]
paradigm = 'STIMULATION_THUBCI_SSVEP_classic40'

[ssvep]
sample_rate = 1000
duration = 3
offset_time = 0.14