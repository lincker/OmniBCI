debug = false

[LOGGING]
# Backend process only; applied when the API server starts.
level = "INFO"
# Relative to the platform user log directory; the filename includes the backend PID.
file_path = "omnibci.log"

[ALGORITHM]
# Seconds of continuous pre-trigger data retained per epoch (0 = none).
# These samples are available for baseline correction; capture does not enable it.
baseline_duration = 0.0

[NEUROENGINE]
# Max items in each mp.Queue between engine and workers.
queue_size = 100
# Maximum time a REST control request waits for the subprocess execution result.
command_timeout_s = 10.0
message_server_ip = '127.0.0.1'
message_server_port = 8765   # must differ from uvicorn HTTP port (8000)

[ACTUATION]
# Actuation (external-device control) subsystem. The engine listens on
# server_ip:server_port; the actuation controller dials in (same topology as
# stimulation) and loads the selected Effector profile to carry out commands.
enabled = false
server_ip = '127.0.0.1'
server_port = 8001
watchdog_timeout_s = 1.0
# Drop commands older than this on the actuation side (seconds). 0 = disabled
# (default). Requires engine/device clocks roughly in sync (LAN + NTP is
# plenty); leave 0 if clocks are not trustworthy.
max_command_age_s = 0.0
# Spawn the actuation subprocess automatically when signal processing is prepared
# (single-machine). false = start it manually: python scripts/run_actuation.py
auto_spawn = true

[STIMULATION]
renderer    = "moderngl"
auto_spawn  = true   # false → multi-machine: start run_stimulation.py manually

[PLUGINS]
# User plugin directory. Leave empty to use the platform default:
#   macOS   : ~/Library/Application Support/OmniBCI/plugins
#   Linux   : ~/.local/share/OmniBCI/plugins
#   Windows : %APPDATA%\OmniBCI\OmniBCI\plugins
# Override with the OMNIBCI_PLUGIN_DIR env var or set an absolute path here.
user_dir = ""
