# Headless tests, spawned-worker integration, and packaged resources run on each
# supported OS; frontend checks run separately. Hardware and display timing need
# separate validation; see docs/validation.md.
# Configure required checks in branch protection.
name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  MPLBACKEND: Agg

jobs:
  tests:
    name: headless (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Linux headers for glcontext source builds
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libx11-dev

      - name: Install package with dev extras
        id: install
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -m "not gui and not hardware and not integration"

      - name: Build and install the wheel instead of the editable checkout
        id: wheel
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -c "import pathlib, subprocess, sys; wheels = list(pathlib.Path('dist').glob('omnibci-*.whl')); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheels[0])])"

      - name: Verify installed schemas and stimulus resources in isolated Python
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: python -I .github/scripts/check_installed_wheel.py

  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Linux headers for glcontext source builds
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libx11-dev

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run integration tests
        run: python -m pytest -m "integration and not gui and not hardware"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Check generated REST types
        run: |
          npm --prefix frontend run codegen
          git diff --exit-code -- frontend/src/api/rest-types.ts

      - name: Run frontend tests
        run: npm --prefix frontend test

      - name: Build the console
        run: npm --prefix frontend run build

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install import-linter
        run: pip install import-linter

      - name: Layering contracts
        run: lint-imports
