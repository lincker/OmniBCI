# REST contract guard: docs/openapi.json must stay in sync with the backend.
#
# Changes to presentation schemas or routes must include a regenerated spec.
# Run python scripts/export_openapi.py locally and commit the result.
# An editable package installation does not need PYTHONPATH=.
#
# This workflow requires docs/openapi.json to be tracked in Git.
# Use the project's Python version and declared dependencies when exporting;
# differences in dependency versions can change the generated spec.
name: contract

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  openapi-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package with declared dependencies
        run: pip install -e .

      - name: Re-export OpenAPI spec
        run: python scripts/export_openapi.py docs/openapi.json

      - name: Spec must match the committed one
        run: |
          git diff --exit-code docs/openapi.json || {
            echo '::error::docs/openapi.json is out of sync. Run python scripts/export_openapi.py and commit the result.'
            exit 1
          }
