# REST 契约守卫 — docs/openapi.json 必须与代码同步。
#
# 任何改动 presentation/schemas 或路由却忘了重新导出 openapi.json 的提交，
# 在此处失败。本地修复：python scripts/export_openapi.py 后提交产物
# （包已 editable 安装时无需 PYTHONPATH=.）。
#
# 注意：本 workflow 依赖 docs/openapi.json 已入库（git tracked）。
# Python 版本与依赖与 pyproject.toml 对齐——spec 必须由和真实环境
# 相同的依赖版本导出，否则 pydantic 版本差异可能让 spec 漂移。
name: contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  openapi-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package (deps pinned by pyproject.toml)
        run: pip install -e .

      - name: Re-export OpenAPI spec
        run: python scripts/export_openapi.py docs/openapi.json

      - name: Spec must match the committed one
        run: |
          git diff --exit-code docs/openapi.json || {
            echo '::error::docs/openapi.json 与代码不同步。本地运行 python scripts/export_openapi.py 并提交。'
            exit 1
          }
