# ============================================================================
# OmniBCI — Single source of truth for project metadata and tool configuration (PEP 621).
#
# Installation:
#   pip install -e .            Runtime dependencies (server)
#   pip install -e ".[stim]"    + Stimulation rendering (display host)
#   pip install -e ".[dev]"     + Tests / contracts / lint (development, CI)
# ============================================================================

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibci"
version = "1.0.0"
description = "OmniBCI — a cross-platform BCI framework (DDD / clean architecture)"
readme = "Readme.md"
requires-python = ">=3.14"
dependencies = [
    # Numerical / signal processing
    "numpy==2.4.4",
    "scipy==1.17.1",
    "mne==1.12.1",
    "scikit-learn==1.8.0",
    # Configuration
    "tomlkit==0.14.0",
    "platformdirs>=4.0",
    "cryptography>=46.0.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "websockets>=12.0",
]

[project.scripts]
omnibci-plugin = "omnibci.plugin_cli:main"

[project.optional-dependencies]
# Stimulation rendering: only needed on machines running the stimulation process.
stim = [
    "pyopengl==3.1.10",
    "glfw==2.10.0",
    "moderngl==5.12.0",
    "pillow>=10.1",
]
dev = [
    "omnibci[stim]",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    # Runtime dependency for Starlette TestClient.
    "httpx>=0.27",
    "import-linter>=2.0",
]

[tool.setuptools.packages.find]
include = ["omnibci*"]

[tool.setuptools.package-data]
# Include non-Python runtime assets in source and wheel distributions.
"omnibci.infrastructure.plugins" = ["**/manifest.toml", "**/*.schema.json", "**/resource/**/*.png", "**/resource/*.ofp"]

# ============================================================================
# pytest
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# All async tests are explicitly marked with @pytest.mark.asyncio.
asyncio_mode = "strict"
markers = [
    "gui: requires a real display and OpenGL context (skipped in headless CI)",
    "hardware: requires real EEG hardware (always skipped in CI)",
    "integration: slower integration tests using real files or process boundaries",
]

# ============================================================================
# import-linter architecture contracts
#
# Run locally with: lint-imports
# ============================================================================
[tool.importlinter]
root_package = "omnibci"
# Imports inside TYPE_CHECKING blocks are type-only and not runtime dependencies.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Clean architecture layers (presentation -> application -> domain)"
type = "layers"
layers = [
    "omnibci.presentation",
    "omnibci.application",
    "omnibci.domain",
]

[[tool.importlinter.contracts]]
name = "Application must not depend on infrastructure"
type = "forbidden"
source_modules = ["omnibci.application"]
forbidden_modules = ["omnibci.infrastructure"]

[[tool.importlinter.contracts]]
name = "Domain must not depend on infrastructure"
type = "forbidden"
source_modules = ["omnibci.domain"]
forbidden_modules = ["omnibci.infrastructure"]

[[tool.importlinter.contracts]]
name = "Infrastructure must not depend on presentation"
type = "forbidden"
source_modules = ["omnibci.infrastructure"]
forbidden_modules = ["omnibci.presentation"]

[[tool.importlinter.contracts]]
name = "Signal Processing must not depend on NeuroEngine"
type = "forbidden"
source_modules = ["omnibci.infrastructure.signal_processing"]
forbidden_modules = ["omnibci.infrastructure.neuroengine"]

[[tool.importlinter.contracts]]
name = "Shared kernel must have zero internal dependencies"
type = "forbidden"
source_modules = ["omnibci.shared"]
forbidden_modules = [
    "omnibci.domain",
    "omnibci.application",
    "omnibci.infrastructure",
    "omnibci.presentation",
]

[[tool.importlinter.contracts]]
name = "Plugin catalog must stay read-only and never depend on execution or plugin implementations"
type = "forbidden"
source_modules = ["omnibci.infrastructure.plugin_management.catalog"]
forbidden_modules = [
    "omnibci.infrastructure.plugin_management.loader",
    "omnibci.infrastructure.plugins",
]

[[tool.importlinter.contracts]]
name = "Configuration management must not depend on runtime services"
type = "forbidden"
source_modules = ["omnibci.application.configuration"]
forbidden_modules = ["omnibci.application.services", "omnibci.application.runtime_admission"]

[[tool.importlinter.contracts]]
name = "Plugin management application layer must not depend on runtime services"
type = "forbidden"
source_modules = ["omnibci.application.plugin_management"]
forbidden_modules = ["omnibci.application.services", "omnibci.application.runtime_admission"]

[[tool.importlinter.contracts]]
name = "Static plugin manifests must not depend on discovery or execution"
type = "forbidden"
source_modules = ["omnibci.infrastructure.plugin_management.manifest"]
forbidden_modules = [
    "omnibci.infrastructure.plugin_management.catalog",
    "omnibci.infrastructure.plugin_management.loader",
    "omnibci.infrastructure.plugin_management.runtime",
    "omnibci.infrastructure.plugin_management.installer",
]

[[tool.importlinter.contracts]]
name = "Plugin management must not import built-in plugin implementations"
type = "forbidden"
source_modules = ["omnibci.infrastructure.plugin_management"]
forbidden_modules = ["omnibci.infrastructure.plugins"]

[[tool.importlinter.contracts]]
name = "Built-in plugin implementations must not import plugin management"
type = "forbidden"
source_modules = ["omnibci.infrastructure.plugins"]
forbidden_modules = ["omnibci.infrastructure.plugin_management"]

[[tool.importlinter.contracts]]
name = "Shared IPC and output hosts must not depend on engine assembly"
type = "forbidden"
source_modules = ["omnibci.infrastructure.ipc", "omnibci.infrastructure.stimulation", "omnibci.infrastructure.actuation"]
forbidden_modules = ["omnibci.infrastructure.neuroengine"]

[[tool.importlinter.contracts]]
name = "WebSocket presentation must not depend on infrastructure codecs"
type = "forbidden"
source_modules = ["omnibci.presentation.websockets"]
forbidden_modules = ["omnibci.infrastructure"]

[[tool.importlinter.contracts]]
name = "Independent output application services must not depend on the Engine service"
type = "forbidden"
source_modules = ["omnibci.application.services.stimulation_service", "omnibci.application.services.actuation_service"]
forbidden_modules = ["omnibci.application.services.engine_service"]
